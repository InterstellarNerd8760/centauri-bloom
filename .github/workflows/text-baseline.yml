name: Text baseline experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bloom/train.py'
      - '.github/workflows/text-baseline.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m bloom.dataset build datasets/public-domain-v1/sources.json runs/public-domain-v1
      - run: python -m bloom.dataset verify runs/public-domain-v1
      - run: python -m bloom.train runs/public-domain-v1 runs/baseline --steps 100 --batch-size 8 --max-tokens 100000 --device cpu
      - run: git rev-parse HEAD > runs/baseline/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-text-baseline
          path: runs/baseline/
          retention-days: 7

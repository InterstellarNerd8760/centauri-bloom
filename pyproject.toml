[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centauri-bloom"
version = "0.0.1"
description = "Volunteer language-model training research scaffold"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "safetensors>=0.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
